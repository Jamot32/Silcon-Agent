  "behaviors": [
    "A byte-oriented I2C master with AXI-stream command, write-data and read-data channels. Commands select 7-bit address and read/write/write_multiple, optional forced start and optional stop; a start is implied when inactive, changing address or changing direction. Write_multiple accepts bytes until tlast, otherwise one byte. Read returns one byte with tlast when stop requested. Hold read data/valid while stalled. prescale sets one quarter SCL period in input clocks and may be 2. Respect clock stretching via scl_i; sda_o/scl_o and sda_t/scl_t are open-drain release indicators (1 releases, 0 pulls low), never drive a logic-high bus. SCL/SDA inputs are externally resolved bus values. busy means transfer in progress; bus_control means this controller owns the active transaction; bus_active tracks START/STOP. missed_ack pulses when an ACK bit is high. stop_on_idle automatically stops if command input is invalid. Synchronous rst_n=0 clears command/data validity, releases the bus, and clears status. Implement the documented Alex Forencich i2c_master interface cycle behavior; output read data is only constrained while valid."
  ],
