  "behaviors": [
    "A serial receiver taking exactly one input in bit per rising clock: idle=1, start=0, eight LSB-first data bits, then stop=1. done is a one-cycle pulse after a valid stop; out_byte is valid only when done=1. A bad stop enters an error state that waits for a high bit before searching for another start. Consecutive frames may have no extra idle bit. Synchronous rst_n=0 returns to idle."
