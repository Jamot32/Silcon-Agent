    "I need a signed fixed-point divide block. a, b and val are 8-bit two's-complement numbers with 4 fractional bits. Compute a/b; support zero dividend and the most-negative representable input as ordinary values. A zero divisor returns valid=0, dbz=1, ovf=0. Round the exact mathematical result to nearest, ties to even. Check overflow AFTER rounding: when the rounded result does not fit the signed output, return valid=0 and ovf=1; otherwise valid=1, ovf=0 and val contains the correctly rounded result. For nonzero divisors dbz=0. Pulse start only while idle; latch operands on that edge. Any implementation latency is acceptable up to 64 clocks after start, including completion on the start edge. busy must stay high while a transaction is pending. A new start clears prior valid. done pulses for exactly one clock on completion; valid and a successful val then hold until the next start. val is unspecified for error results. Synchronous active-low rst_n clears busy, done, valid, error flags and val, and aborts an operation."
