  "behaviors": [
    "A parallel byte-stream CRC-32 engine, Galois polynomial 32'h04c11db7, initial all-ones internal state, reflected LSB-first input/output, and bitwise complemented crc_out. Each data_in_valid clock updates the state for all 8 bits of data_in; otherwise hold. Synchronous rst_n=0 restores the all-ones state, so crc_out is zero. The highest polynomial term is implicit. No start/end framing signal: use reset to begin a new message."
