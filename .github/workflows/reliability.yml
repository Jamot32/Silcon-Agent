name: Real development reliability gate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: silicon-reliability
  cancel-in-progress: false

jobs:
  reliability:
    # This runner holds the provisioned private DEV corpus, pinned EDA image
    # and saved Codex login. Dispatch only reviewed code through this protected
    # environment; pull requests never invoke plan inference automatically.
    runs-on: [self-hosted, silicon-reliability]
    environment: reliability-eval
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          clean: false
          persist-credentials: false
      - name: Evaluate and compare with the committed kept baseline
        run: make reliability-ci
      - name: Preserve sanitized aggregate exports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: reliability-public
          path: runs/reliability-public/
          if-no-files-found: ignore
